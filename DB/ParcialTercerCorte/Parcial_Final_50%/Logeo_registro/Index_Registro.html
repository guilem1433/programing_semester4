<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Banco GlobalTrust</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/a2d9d6e52f.js" crossorigin="anonymous"></script>
</head>
<body>

<div class="container">

    <div class="logo">
        <span>GlobalTrust Bank</span>
    </div>

    <h2>Crea tu Cuenta Segura</h2>

    <div class="input-box">
        <i class="fa-solid fa-user"></i>
        <input type="text" id="nombre" placeholder="Nombre completo">
    </div>

    <div class="input-box">
        <i class="fa-solid fa-envelope"></i>
        <input type="email" id="correo" placeholder="Correo electrónico">
    </div>

    <div class="input-box">
        <i class="fa-solid fa-lock"></i>
        <input type="password" id="pass" placeholder="Contraseña">
    </div>

    <div class="input-box">
        <i class="fa-solid fa-lock"></i>
        <input type="password" id="pass2" placeholder="Confirmar contraseña">
    </div>

    <button onclick="registrar()">REGISTRARME</button>

    <p>¿Ya tienes cuenta? <a href="index_login.html">Inicia sesión</a></p>
</div>

<script src="script.js"></script>

</body>
</html>
