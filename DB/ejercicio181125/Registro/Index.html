<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Biblioteca ESEIT</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

<div class="overlay"></div>

<div class="form-container">
    <h2>ESEIT 📚</h2>
    <p>Registro de usuarios para acceso a la plataforma</p>

    <form id="registroForm">

        <label>Nombre Completo</label>
        <input type="text" id="nombre" placeholder="Ej: Juan Esteban Torres">

        <label>Correo institucional</label>
        <input type="email" id="correo" placeholder="Ej: juan.torres@eseit.edu.co">

        <label>Contraseña</label>
        <input type="password" id="password" placeholder="Mínimo 6 caracteres">

        <label>Programa académico</label>
        <select id="programa">
            <option value="">Seleccione...</option>
            <option value="Ingeniería de Sistemas">Ingeniería de Sistemas</option>
            <option value="Administración">Administración</option>
            <option value="Contabilidad">Contabilidad</option>
            <option value="Contabilidad">Docente</option>
            <option value="Contabilidad">Estudiante</option>
            <option value="Contabilidad">Admin</option>
            <option value="Otros">Otros</option>
        </select>

        <button class="btn" type="submit">Registrarme</button>

        <p style="text-align:center; margin-top: 15px;">
            <a href="../Login/Index.html" style="color:#005ecb; font-weight:bold;">
                Regresar a inicio</a>
        </p>       

    </form>
</div>
</body>
</html>
