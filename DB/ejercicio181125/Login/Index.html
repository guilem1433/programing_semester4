<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso a plataforma ESEIT</title>
    <link rel="stylesheet" href="Estilos.css">
</head>
<body>

<div class="overlay"></div>

<div class="form-container">
    <h2>Ingreso a plataforma ESEIT 🔑</h2>
    <p>Ingresa con tu cuenta de usuario</p>

    <form id="loginForm">

        <label>Correo electrónico</label>
        <input type="email" id="correo" placeholder="Ej: usuario@eseit.edu.co">

        <label>Contraseña</label>
        <input type="password" id="password" placeholder="Tu contraseña">

        <button class="btn" type="submit">Ingresar</button>

        <div id="mensaje"></div>

        <p style="text-align:center; margin-top: 15px;">
            ¿No tienes cuenta?
            <a href="../Registro/Index.html" style="color:#005ecb; font-weight:bold;">
                Regístrate aquí
            </a>
        </p>

    </form>
</div>
</body>
</html>
