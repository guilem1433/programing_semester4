<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Banco GlobalTrust</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/a2d9d6e52f.js" crossorigin="anonymous"></script>
</head>
<body>

<div class="container">

    <div class="logo">
        <span>GlobalTrust Bank</span>
    </div>

    <h2>Acceso Seguro</h2>

    <div class="input-box">
        <i class="fa-solid fa-envelope"></i>
        <input type="email" id="correoLogin" placeholder="Correo electrónico">
    </div>

    <div class="input-box">
        <i class="fa-solid fa-lock"></i>
        <input type="password" id="passLogin" placeholder="Contraseña">
    </div>

    <button onclick="login()">INGRESAR</button>

    <p>¿No tienes cuenta? <a href="Index_Registro.html">Crear cuenta</a></p>

</div>

<script src="script.js"></script>

</body>
</html>
